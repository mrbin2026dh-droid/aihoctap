services:
  - type: web
    name: ai-sgk-tinhoc
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: RELOAD
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
