name = "aihoctap-gate"
main = "worker/index.js"
compatibility_date = "2026-10-24"
compatibility_flags = ["nodejs_compat"]

# Học sinh Việt Nam thường vào Cloudflare qua Hong Kong (HKG). Google KHÔNG cho gọi Gemini từ Hong Kong
# (lỗi 400 "User location is not supported") → AI chấm / Gia sư báo 502. Đặt Worker chạy ở Mỹ (vùng được hỗ trợ).
# Nếu wrangler báo không hỗ trợ dòng region, thay bằng: mode = "smart"
[placement]
region = "aws:us-east-1"

[durable_objects]
bindings = [
  { name = "GATE_DO", class_name = "GateDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GateDurableObject"]

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_FALLBACK_MODEL = "gemini-flash-lite-latest"
# Đăng nhập học sinh bằng Google Sheet "HocSinh" (Mã học sinh + Mã PIN). Xóa dòng này để quay lại tài khoản Firebase cũ.
SHEET_LOGIN_URL = "https://script.google.com/macros/s/AKfycbwOStBHPAZfMUOyOJEWX4ALrpKiCnJG88u0wElu5fdYvb6scqNDDDq8NpsSpC6h0UbdtA/exec"
