name = "aihoctap-gate"
main = "worker/index.js"
compatibility_date = "2026-10-24"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "GATE_DO", class_name = "GateDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GateDurableObject"]

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
