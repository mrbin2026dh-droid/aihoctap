name: Deploy Student PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stamp and verify service worker
        run: |
          python tools/package_student_pwa.py --stamp
          python tools/package_student_pwa.py

      - name: Upload Student PWA Artifact (frontend/hoc only)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/hoc'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
